<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Управление гардеробом</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Встроенный отлов критических ошибок (чтобы больше не гадать) -->
    <script>
        window.onerror = function(msg, url, line) {
            alert("Системная ошибка: " + msg + " (строка " + line + ")");
        };
    </script>

    <style>
        :root { --bg: #f2f4f7; --card: #ffffff; --text: #111827; --subtext: #6b7280; --accent: #2563eb; --border: #e5e7eb; --danger: #ef4444; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 90px; }

        .header { background: var(--card); padding: 12px 14px 8px; position: sticky; top: 0; z-index: 50; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
        .search-row { display: flex; gap: 8px; margin-bottom: 10px; }
        .search-input, .filter-select { flex: 1; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; background: #f9fafb; outline: none; }
        
        .tabs { display: flex; gap: 6px; }
        .tab { flex: 1; text-align: center; padding: 9px 4px; font-weight: 600; font-size: 13px; color: var(--subtext); border-radius: 8px; cursor: pointer; background: #f3f4f6; }
        .tab.active { background: var(--accent); color: #fff; }
        .badge-count { display: inline-block; padding: 1px 6px; border-radius: 10px; font-size: 11px; margin-left: 4px; background: rgba(0,0,0,0.12); }

        .bulk-bar { display: none; justify-content: space-between; align-items: center; padding: 10px 14px; background: #eff6ff; border-bottom: 1px solid #bfdbfe; font-size: 13px; font-weight: 600; color: #1e40af; }
        .bulk-bar.visible { display: flex; }
        .bulk-btn { background: var(--accent); color: #fff; border: none; padding: 7px 12px; border-radius: 8px; font-weight: 600; font-size: 12px; cursor: pointer; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
        .card { background: var(--card); border-radius: 14px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.05); display: flex; flex-direction: column; border: 1px solid var(--border); }
        .img-wrap { position: relative; width: 100%; height: 185px; background: #e5e7eb; cursor: pointer; }
        .img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .cat-pill { position: absolute; top: 8px; left: 8px; background: rgba(17,24,39,0.72); backdrop-filter: blur(4px); color: #fff; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 500; }
        .card-body { padding: 10px; flex-grow: 1; display: flex; flex-direction: column; gap: 4px; cursor: pointer; }
        .card-title { font-weight: 700; font-size: 14px; line-height: 1.25; color: var(--text); }
        .card-meta { font-size: 12px; color: var(--subtext); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .color-dot { width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.2); display: inline-block; }
        
        .move-bar { display: flex; border-top: 1px solid var(--border); background: #f9fafb; }
        .move-btn { flex: 1; padding: 10px 4px; font-size: 11px; font-weight: 700; border: none; background: transparent; cursor: pointer; color: var(--accent); border-right: 1px solid var(--border); }
        .move-btn:last-child { border-right: none; }

        .fab { position: fixed; bottom: 20px; right: 20px; width: 58px; height: 58px; border-radius: 29px; background: var(--accent); color: #fff; font-size: 32px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(37,99,235,0.4); border: none; z-index: 90; cursor: pointer; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 200; align-items: flex-end; justify-content: center; }
        .modal.active { display: flex; }
        .modal-sheet { background: var(--card); width: 100%; max-width: 500px; max-height: 92vh; border-radius: 20px 20px 0 0; padding: 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { margin: 0; font-size: 18px; }
        .close-x { background: none; border: none; font-size: 22px; color: var(--subtext); cursor: pointer; }
        
        .photo-preview-box { width: 100%; height: 220px; border-radius: 12px; background: #f3f4f6; border: 2px dashed var(--border); display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; cursor: pointer; }
        .photo-preview-box img { width: 100%; height: 100%; object-fit: contain; background: #111; }
        .photo-placeholder { color: var(--subtext); font-size: 14px; font-weight: 500; text-align: center; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .field { display: flex; flex-direction: column; gap: 4px; }
        .field label { font-size: 11px; font-weight: 700; color: var(--subtext); text-transform: uppercase; }
        .field input, .field select { padding: 11px; border: 1px solid var(--border); border-radius: 9px; font-size: 15px; background: #f9fafb; outline: none; width: 100%; }

        .modal-actions { display: flex; gap: 10px; margin-top: 6px; }
        .btn-primary { flex: 2; padding: 13px; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; }
        .btn-danger { flex: 1; padding: 13px; background: #fee2e2; color: var(--danger); border: none; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; }

        .sync-indicator { position: fixed; bottom: 16px; left: 16px; background: rgba(17,24,39,0.8); color: #fff; padding: 6px 12px; border-radius: 20px; font-size: 12px; display: none; z-index: 100; }
        .empty { grid-column: 1 / -1; text-align: center; padding: 50px 20px; color: var(--subtext); }

        #telegramOnlyScreen { display: none; position: fixed; inset: 0; background: #fff; z-index: 999; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
        #telegramOnlyScreen h2 { margin-bottom: 5px; color: var(--text); }
        #telegramOnlyScreen p { color: var(--subtext); line-height: 1.5; }
    </style>
</head>
<body>

    <div id="telegramOnlyScreen">
        <h2>Доступ ограничен</h2>
        <p>Пожалуйста, откройте это приложение через Telegram.<br>Авторизация происходит автоматически.</p>
    </div>

    <!-- По умолчанию блок скрыт, мы покажем его только после проверок -->
    <div id="appContent" style="display:none;">
        <div class="header">
            <div class="search-row">
                <input type="text" id="searchInput" class="search-input" placeholder="Поиск..." oninput="render()">
                <select id="catFilter" class="filter-select" onchange="render()"></select>
            </div>
            <div class="tabs">
                <div class="tab active" data-tab="IN_CLOSET" onclick="setTab('IN_CLOSET')">Шкаф <span class="badge-count" id="cnt-IN_CLOSET">0</span></div>
                <div class="tab" data-tab="WASHING" onclick="setTab('WASHING')">Стирка <span class="badge-count" id="cnt-WASHING">0</span></div>
                <div class="tab" data-tab="DRYING" onclick="setTab('DRYING')">Сушилка <span class="badge-count" id="cnt-DRYING">0</span></div>
            </div>
        </div>

        <div id="bulkBar" class="bulk-bar"><span id="bulkText">Действие</span><button id="bulkBtn" class="bulk-btn" onclick="executeBulkAction()">Выполнить</button></div>
        <div id="grid" class="grid"></div>
        <button class="fab" onclick="openModal()">+</button>
        <div id="syncStatus" class="sync-indicator">Синхронизация...</div>
    </div>

    <!-- Модальное окно -->
    <div class="modal" id="itemModal" onclick="if(event.target===this) closeModal()">
        <div class="modal-sheet">
            <div class="modal-header"><h3 id="modalTitle">Свойства вещи</h3><button class="close-x" onclick="closeModal()">✕</button></div>

            <label class="photo-preview-box" id="photoBox">
                <span class="photo-placeholder" id="photoPlaceholder">📷 Нажми, чтобы сделать фото</span>
                <img id="photoPreview" style="display:none;" alt="Preview">
                <input type="file" id="photoInput" accept="image/*" style="display:none;" onchange="handlePhotoSelect(event)">
            </label>

            <div class="field">
                <label>Название вещи</label>
                <input type="text" id="fName" placeholder="Например: Свитшот с принтом">
            </div>

            <div class="form-row">
                <div class="field">
                    <label>Категория (Выбери или введи)</label>
                    <input type="text" id="fCategory" list="cat-suggestions" placeholder="Впиши или выбери...">
                    <datalist id="cat-suggestions">
                        <option value="Верх / Худи"></option>
                        <option value="Футболки"></option>
                        <option value="Штаны / Джинсы"></option>
                        <option value="Обувь"></option>
                        <option value="Белье / Носки"></option>
                    </datalist>
                </div>
                <div class="field">
                    <label>Статус</label>
                    <select id="fStatus">
                        <option value="IN_CLOSET">В шкафу</option><option value="WASHING">В стирке</option><option value="DRYING">На сушилке</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="field"><label>Бренд</label><input type="text" id="fBrand" placeholder="Например: Nike"></div>
                <div class="field"><label>Цвет</label><input type="text" id="fColor" placeholder="Например: Черный"></div>
            </div>

            <div class="field"><label>Заметки / Уход</label><input type="text" id="fNotes" placeholder="Например: 40°C"></div>

            <div class="modal-actions">
                <button class="btn-danger" id="btnDelete" style="display:none;" onclick="deleteCurrentItem()">Удалить</button>
                <button class="btn-primary" id="btnSave" onclick="saveCurrentItem()">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
        // 1. ВСТАВЬ СВОЮ ССЫЛКУ СЮДА
        var API_URL = "https://script.google.com/macros/s/AKfycbwcOpE2mAJnEmj4sjZfnB1womgZwOLueOai_y14g9OcTAM0vI9Yoo_egLHwndi4W4dZIQ/exec";
        
        var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg) tg.expand();

        // 2. БЕЗОПАСНО ДОСТАЕМ ID (без ломающего синтаксиса ?.)
        var myTgId = null;
        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
            myTgId = tg.initDataUnsafe.user.id;
        }

        var items = [];
        var currentTab = "IN_CLOSET";
        var editingId = null;
        var currentPhotoData = "";
        
        // Меняем ключ кэша на v5, чтобы гарантированно сбросить сломанные данные
        var CACHE_KEY = "wardrobe_v5_" + myTgId;
        var COLOR_MAP = { "черный": "#111827", "белый": "#ffffff", "серый": "#9ca3af", "синий": "#2563eb", "красный": "#ef4444", "зеленый": "#10b981", "желтый": "#facc15", "коричневый": "#78350f", "розовый": "#ec4899" };

        function showSync(text) {
            var el = document.getElementById('syncStatus');
            if (!text) { el.style.display = 'none'; return; }
            el.innerText = text; el.style.display = 'block';
        }

        async function fetchFromCloud() {
            showSync("Синхронизация...");
            try {
                var res = await fetch(API_URL + "?user_id=" + myTgId);
                var data = await res.json();
                if (Array.isArray(data)) {
                    items = data;
                    localStorage.setItem(CACHE_KEY, JSON.stringify(items));
                    render();
                }
            } catch (e) { console.log("Работаем оффлайн", e); }
            showSync("");
        }

        function updateDynamicFilters() {
            var select = document.getElementById('catFilter');
            var currentVal = select.value || "ALL";
            
            var allCats = items.map(function(i) { return i.category; }).filter(Boolean);
            var uniqueCats = Array.from(new Set(allCats));
            
            var html = '<option value="ALL">Все категории</option>';
            uniqueCats.forEach(function(cat) { html += '<option value="' + cat + '">' + cat + '</option>'; });
            
            select.innerHTML = html;
            if (uniqueCats.includes(currentVal)) select.value = currentVal;
            else select.value = "ALL";
        }

        function render() {
            updateDynamicFilters();
            
            ["IN_CLOSET", "WASHING", "DRYING"].forEach(function(st) {
                var count = items.filter(function(i) { return i.status === st; }).length;
                document.getElementById('cnt-' + st).innerText = count;
            });

            var bulkBar = document.getElementById('bulkBar');
            var currentCount = items.filter(function(i) { return i.status === currentTab; }).length;
            if (currentTab === "WASHING" && currentCount > 0) {
                bulkBar.classList.add('visible'); document.getElementById('bulkText').innerText = "В стирке: " + currentCount; document.getElementById('bulkBtn').innerText = "Всё на сушилку →";
            } else if (currentTab === "DRYING" && currentCount > 0) {
                bulkBar.classList.add('visible'); document.getElementById('bulkText').innerText = "Высохло: " + currentCount; document.getElementById('bulkBtn').innerText = "Всё в шкаф ✓";
            } else { bulkBar.classList.remove('visible'); }

            var grid = document.getElementById('grid');
            var query = document.getElementById('searchInput').value.trim().toLowerCase();
            var cat = document.getElementById('catFilter').value;

            var filtered = items.filter(function(i) { return i.status === currentTab; });
            if (cat !== "ALL") filtered = filtered.filter(function(i) { return i.category === cat; });
            if (query) {
                filtered = filtered.filter(function(i) {
                    return (i.name||"").toLowerCase().includes(query) || (i.brand||"").toLowerCase().includes(query) || (i.category||"").toLowerCase().includes(query);
                });
            }

            if (filtered.length === 0) { grid.innerHTML = '<div class="empty">Список пуст.</div>'; return; }

            grid.innerHTML = filtered.map(function(item) {
                var colorKey = (item.color || "").toLowerCase();
                var hex = COLOR_MAP[colorKey] || null;
                var colorDot = hex ? '<span class="color-dot" style="background:' + hex + '"></span>' : '';
                
                var moveButtons = '';
                if (item.status === 'IN_CLOSET') {
                    moveButtons = '<button class="move-btn" onclick="moveItem(\'' + item.id + '\', \'WASHING\')">🧺 В стирку</button><button class="move-btn" onclick="moveItem(\'' + item.id + '\', \'DRYING\')">☀️ На сушилку</button>';
                } else if (item.status === 'WASHING') {
                    moveButtons = '<button class="move-btn" onclick="moveItem(\'' + item.id + '\', \'IN_CLOSET\')">← В шкаф</button><button class="move-btn" onclick="moveItem(\'' + item.id + '\', \'DRYING\')">☀️ На сушилку →</button>';
                } else {
                    moveButtons = '<button class="move-btn" onclick="moveItem(\'' + item.id + '\', \'WASHING\')">← В стирку</button><button class="move-btn" onclick="moveItem(\'' + item.id + '\', \'IN_CLOSET\')">👕 В шкаф ✓</button>';
                }

                return '<div class="card">' +
                            '<div class="img-wrap" onclick="openModal(\'' + item.id + '\')"><img src="' + item.photo + '" loading="lazy"><span class="cat-pill">' + (item.category || 'Без категории') + '</span></div>' +
                            '<div class="card-body" onclick="openModal(\'' + item.id + '\')">' +
                                '<div class="card-title">' + (item.name || 'Без названия') + '</div>' +
                                '<div class="card-meta">' + colorDot + '<span>' + (item.brand || '') + ' ' + (item.color || '') + '</span></div>' +
                            '</div>' +
                            '<div class="move-bar">' + moveButtons + '</div>' +
                        '</div>';
            }).join('');
        }

        window.setTab = function(tab) {
            if (tg) tg.HapticFeedback.impactOccurred('light');
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(function(t) {
                t.classList.toggle('active', t.dataset.tab === tab);
            });
            render();
        };

        window.moveItem = async function(id, newStatus) {
            if (tg) tg.HapticFeedback.impactOccurred('light');
            var item = items.find(function(i) { return String(i.id) === String(id); });
            if (!item) return;
            item.status = newStatus; localStorage.setItem(CACHE_KEY, JSON.stringify(items)); render();
            fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "statusBatch", ids: [id], status: newStatus, user_id: myTgId }) });
        };

        window.executeBulkAction = async function() {
            if (tg) tg.HapticFeedback.impactOccurred('light');
            var targetStatus = currentTab === "WASHING" ? "DRYING" : "IN_CLOSET";
            var affectedIds = items.filter(function(i) { return i.status === currentTab; }).map(function(i) { return i.id; });
            if (affectedIds.length === 0) return;
            items.forEach(function(i) { if (affectedIds.includes(i.id)) i.status = targetStatus; });
            localStorage.setItem(CACHE_KEY, JSON.stringify(items)); render();
            fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "statusBatch", ids: affectedIds, status: targetStatus, user_id: myTgId }) });
        };

        window.openModal = function(id) {
            if (tg) tg.HapticFeedback.impactOccurred('light');
            editingId = id || null;
            if (id) {
                var item = items.find(function(i) { return String(i.id) === String(id); });
                document.getElementById('modalTitle').innerText = "Редактировать";
                document.getElementById('fName').value = item.name || "";
                document.getElementById('fCategory').value = item.category || "";
                document.getElementById('fStatus').value = item.status || "IN_CLOSET";
                document.getElementById('fBrand').value = item.brand || "";
                document.getElementById('fColor').value = item.color || "";
                document.getElementById('fNotes').value = item.notes || "";
                currentPhotoData = item.photo || "";
                if (currentPhotoData) { document.getElementById('photoPreview').src = currentPhotoData; document.getElementById('photoPreview').style.display = "block"; document.getElementById('photoPlaceholder').style.display = "none"; }
                document.getElementById('btnDelete').style.display = "block";
            } else {
                document.getElementById('modalTitle').innerText = "Новая вещь";
                document.getElementById('fName').value = ""; document.getElementById('fCategory').value = ""; document.getElementById('fStatus').value = currentTab; document.getElementById('fBrand').value = ""; document.getElementById('fColor').value = ""; document.getElementById('fNotes').value = "";
                currentPhotoData = ""; document.getElementById('photoPreview').style.display = "none"; document.getElementById('photoPlaceholder').style.display = "block"; document.getElementById('btnDelete').style.display = "none";
            }
            document.getElementById('itemModal').classList.add('active');
        };

        window.closeModal = function() { document.getElementById('itemModal').classList.remove('active'); };

        window.handlePhotoSelect = function(e) {
            var file = e.target.files[0]; if (!file) return;
            var reader = new FileReader();
            reader.onload = function(ev) {
                var img = new Image();
                img.onload = function() {
                    var canvas = document.createElement('canvas');
                    var w = img.width, h = img.height;
                    if (w > 1000 || h > 1000) { if (w > h) { h = Math.round(h * 1000 / w); w = 1000; } else { w = Math.round(w * 1000 / h); h = 1000; } }
                    canvas.width = w; canvas.height = h; canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    currentPhotoData = canvas.toDataURL('image/jpeg', 0.88);
                    document.getElementById('photoPreview').src = currentPhotoData; document.getElementById('photoPreview').style.display = "block"; document.getElementById('photoPlaceholder').style.display = "none";
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file); e.target.value = "";
        };

        window.saveCurrentItem = async function() {
            if (!currentPhotoData) { alert("Необходимо добавить фото"); return; }
            if (tg) tg.HapticFeedback.impactOccurred('light');

            var itemObj = {
                id: editingId ? String(editingId) : String(Date.now()),
                photo: currentPhotoData,
                name: document.getElementById('fName').value.trim(),
                category: document.getElementById('fCategory').value.trim(),
                status: document.getElementById('fStatus').value,
                brand: document.getElementById('fBrand').value.trim(),
                color: document.getElementById('fColor').value.trim(),
                notes: document.getElementById('fNotes').value.trim()
            };

            if (editingId) { 
                var idx = items.findIndex(function(i) { return String(i.id) === String(editingId); }); 
                if (idx !== -1) items[idx] = itemObj; 
            } else { items.unshift(itemObj); }

            localStorage.setItem(CACHE_KEY, JSON.stringify(items)); render(); closeModal(); showSync("Сохранение...");
            try {
                var res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "save", item: itemObj, user_id: myTgId }) });
                var result = await res.json();
                if (result.ok && result.photoUrl) { 
                    var saved = items.find(function(i) { return String(i.id) === String(itemObj.id); }); 
                    if (saved) { saved.photo = result.photoUrl; localStorage.setItem(CACHE_KEY, JSON.stringify(items)); } 
                }
            } catch (e) {} showSync("");
        };

        window.deleteCurrentItem = async function() {
            if (!editingId || !confirm("Удалить вещь безвозвратно?")) return;
            if (tg) tg.HapticFeedback.impactOccurred('light');
            items = items.filter(function(i) { return String(i.id) !== String(editingId); });
            localStorage.setItem(CACHE_KEY, JSON.stringify(items)); render(); closeModal();
            fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "delete", id: editingId, user_id: myTgId }) });
        };

        // Запуск логики
        try {
            if (!myTgId) {
                document.getElementById('telegramOnlyScreen').style.display = 'flex';
            } else {
                document.getElementById('appContent').style.display = 'block';
                var savedData = localStorage.getItem(CACHE_KEY);
                items = savedData ? JSON.parse(savedData) : [];
                if (!Array.isArray(items)) items = [];
                render();
                fetchFromCloud();
            }
        } catch(e) {
            alert("Ошибка запуска: " + e.message);
        }
    </script>
</body>
</html>
