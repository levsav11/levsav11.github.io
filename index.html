<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Управление Гардеробом</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* ЦВЕТОВЫЕ ТЕМЫ */
        :root { 
            --theme-closet: #f97316;     
            --theme-washing: #3b82f6;    
            --theme-drying: #8b5cf6;     
            
            --bg-closet-light: rgba(249, 115, 22, 0.08);
            --bg-washing-light: rgba(59, 130, 246, 0.08);
            --bg-drying-light: rgba(139, 92, 246, 0.08);

            --active-accent: var(--theme-closet); 
            --active-light: var(--bg-closet-light);

            --bg: #f2f4f7; --card: #ffffff; --text: #111827; --subtext: #6b7280; 
            --border: #e5e7eb; --danger: #ef4444; --input-bg: #f9fafb; --overlay: rgba(0,0,0,0.55); 
        }

        @media (prefers-color-scheme: dark) {
            :root { 
                --bg: #111827; --card: #1f2937; --text: #f9fafb; --subtext: #9ca3af; 
                --border: #374151; --danger: #f87171; --input-bg: #111827; --overlay: rgba(0,0,0,0.75); 
                --theme-closet: #f59e0b; --theme-washing: #3b82f6; --theme-drying: #a855f7;
                --bg-closet-light: rgba(245, 158, 11, 0.15); --bg-washing-light: rgba(59, 130, 246, 0.15); --bg-drying-light: rgba(168, 85, 247, 0.15);
            }
        }
        body.dark-theme { 
            color-scheme: dark;
            --bg: #111827; --card: #1f2937; --text: #f9fafb; --subtext: #9ca3af; 
            --border: #374151; --danger: #f87171; --input-bg: #111827; --overlay: rgba(0,0,0,0.75); 
            --theme-closet: #f59e0b; --theme-washing: #3b82f6; --theme-drying: #a855f7;
            --bg-closet-light: rgba(245, 158, 11, 0.15); --bg-washing-light: rgba(59, 130, 246, 0.15); --bg-drying-light: rgba(168, 85, 247, 0.15);
        }

        body.tab-IN_CLOSET { --active-accent: var(--theme-closet); --active-light: var(--bg-closet-light); }
        body.tab-WASHING { --active-accent: var(--theme-washing); --active-light: var(--bg-washing-light); }
        body.tab-DRYING { --active-accent: var(--theme-drying); --active-light: var(--bg-drying-light); }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 90px; transition: background-color 0.3s; }

        /* ЗАСТАВКА */
        #splashScreen { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s ease, visibility 0.5s; }
        .splash-icon { width: 64px; height: 64px; color: var(--text); margin-bottom: 16px; opacity: 0; animation: fadeUp 0.6s ease forwards; }
        .splash-title { font-size: 24px; font-weight: 700; color: var(--text); letter-spacing: 1px; opacity: 0; animation: fadeUp 0.6s ease 0.2s forwards; }
        .splash-loader { margin-top: 24px; width: 30px; height: 30px; border: 3px solid var(--border); border-top-color: var(--text); border-radius: 50%; animation: spin 1s linear infinite, fadeUp 0.6s ease 0.4s forwards; opacity: 0; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { to { transform: rotate(360deg); } }

        .header { background: var(--card); padding: 12px 14px 8px; position: sticky; top: 0; z-index: 50; box-shadow: 0 1px 4px rgba(0,0,0,0.06); border-bottom: 1px solid var(--border); }
        
        .search-container { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
        .search-row-inner { display: flex; gap: 8px; }
        .search-input, .filter-select { flex: 1; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; background: var(--input-bg); color: var(--text); outline: none; transition: border-color 0.2s; }
        
        .filter-select {
            appearance: none; -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat; background-position: right 10px center; background-size: 16px; padding-right: 32px;
        }
        body.dark-theme .filter-select {
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239ca3af' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
        }

        .search-input:focus, .filter-select:focus { border-color: var(--active-accent); }
        
        .tabs { display: flex; gap: 6px; }
        .tab { flex: 1; text-align: center; padding: 9px 4px; font-weight: 600; font-size: 13px; color: var(--subtext); border-radius: 8px; cursor: pointer; background: var(--input-bg); transition: 0.3s ease; }
        .tab.active { background: var(--active-accent); color: #fff; }
        .badge-count { display: inline-block; padding: 1px 6px; border-radius: 10px; font-size: 11px; margin-left: 4px; background: rgba(0,0,0,0.15); }

        .bulk-bar { display: none; justify-content: space-between; align-items: center; padding: 10px 14px; background: var(--active-light); border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 600; color: var(--active-accent); transition: 0.3s ease; }
        .bulk-bar.visible { display: flex; }
        .bulk-btn { background: var(--active-accent); color: #fff; border: none; padding: 7px 12px; border-radius: 8px; font-weight: 600; font-size: 12px; cursor: pointer; transition: 0.2s; }

        .grid { display: flex; flex-wrap: wrap; gap: 12px; padding: 12px; align-items: flex-start; }
        
        @keyframes slideUpCard { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .card { width: calc(50% - 6px); background: var(--card); border-radius: 14px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.05); display: flex; flex-direction: column; border: 1px solid var(--border); animation: slideUpCard 0.3s ease-out forwards; }
        
        .img-wrap { position: relative; width: 100%; height: 185px; background: var(--input-bg); cursor: pointer; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .placeholder-img { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: var(--input-bg); color: var(--subtext); }
        .placeholder-img svg { width: 40px; height: 40px; opacity: 0.3; }
        
        .cat-pill { position: absolute; top: 8px; left: 8px; background: rgba(17,24,39,0.72); backdrop-filter: blur(4px); color: #fff; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 500; }
        
        .card-body { padding: 10px; flex-grow: 1; display: flex; flex-direction: column; gap: 4px; cursor: pointer; overflow: hidden; }
        .card-title { font-weight: 700; font-size: 14px; line-height: 1.25; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .card-meta { font-size: 12px; color: var(--subtext); display: flex; align-items: center; gap: 6px; overflow: hidden; width: 100%; }
        .card-meta span.meta-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
        
        /* Исправленный идеальный круг */
        .color-dot { width: 14px; height: 14px; flex: 0 0 14px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(128,128,128,0.25); display: block; -webkit-mask-image: -webkit-radial-gradient(white, black); }
        
        .move-bar { display: flex; border-top: 1px solid var(--border); background: var(--input-bg); }
        .move-btn { flex: 1; padding: 10px 2px; font-size: 11px; font-weight: 700; border: none; background: transparent; cursor: pointer; border-right: 1px solid var(--border); transition: 0.2s; }
        .move-btn:last-child { border-right: none; }
        .move-btn.to-closet { color: var(--theme-closet); background: var(--bg-closet-light); }
        .move-btn.to-washing { color: var(--theme-washing); background: var(--bg-washing-light); }
        .move-btn.to-drying { color: var(--theme-drying); background: var(--bg-drying-light); }
        .move-btn:active { opacity: 0.7; }

        .fab { position: fixed; bottom: 20px; right: 20px; width: 58px; height: 58px; border-radius: 29px; background: var(--active-accent); color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(0,0,0,0.2); border: none; z-index: 90; cursor: pointer; transition: 0.3s; }
        .fab svg { width: 28px; height: 28px; stroke-width: 2; }
        .fab:active { transform: scale(0.95); }

        /* МОДАЛЬНЫЕ ОКНА */
        .modal { display: none; position: fixed; inset: 0; background: var(--overlay); z-index: 200; align-items: flex-end; justify-content: center; opacity: 0; transition: opacity 0.3s ease; }
        .modal.active { display: flex; opacity: 1; }
        .modal-sheet { background: var(--card); width: 100%; max-width: 500px; height: 92vh; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.1, 0.9, 0.2, 1); }
        .modal.active .modal-sheet { transform: translateY(0); }
        
        .modal-header { padding: 16px 18px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .modal-header h3 { margin: 0; font-size: 17px; font-weight: 700; color: var(--text); }
        .close-btn-icon { background: var(--input-bg); border: none; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 16px; color: var(--subtext); cursor: pointer; }

        /* РЕЖИМ ПРОСМОТРА */
        .view-mode { display: flex; flex-direction: column; flex-grow: 1; overflow-y: auto; }
        .view-photo-area { position: relative; width: 100%; height: 280px; background: var(--card); display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
        .view-blur-bg { position: absolute; inset: -20px; background-size: cover; background-position: center; filter: blur(15px); opacity: 0.35; z-index: 0; }
        .view-photo-area img { position: relative; z-index: 1; max-width: 100%; max-height: 100%; object-fit: contain; cursor: zoom-in; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .view-info-area { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
        .view-title { font-size: 22px; font-weight: 800; color: var(--text); margin: 0; line-height: 1.2; }
        .view-tags { display: flex; gap: 8px; flex-wrap: wrap; }
        .view-tag { background: var(--input-bg); color: var(--text); font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); display: flex; align-items: center; gap: 6px; }
        .view-details { background: var(--input-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .detail-row { display: flex; justify-content: space-between; font-size: 14px; }
        .detail-label { color: var(--subtext); font-weight: 500; }
        .detail-value { color: var(--text); font-weight: 600; text-align: right; }
        
        .btn-edit-mode { display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--text); color: var(--card); border: none; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 8px; }
        .btn-edit-mode svg { width: 18px; height: 18px; }

        /* РЕЖИМ РЕДАКТИРОВАНИЯ */
        .edit-mode { display: flex; flex-direction: column; flex-grow: 1; display: none; }
        .modal-top { padding: 15px 18px; flex-shrink: 0; background: var(--card); z-index: 10; border-bottom: 1px solid var(--border); }
        .photo-preview-box { width: 100%; height: 160px; border-radius: 12px; background: var(--input-bg); border: 2px dashed var(--border); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .photo-preview-box img { max-width: 100%; max-height: 100%; object-fit: contain; cursor: zoom-in; }
        .photo-placeholder { color: var(--subtext); font-size: 13px; font-weight: 600; text-align: center; cursor: pointer; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.2s; }
        .photo-placeholder svg { width: 32px; height: 32px; margin-bottom: 8px; opacity: 0.4; }
        .btn-change-photo { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.7); color: #fff; border: 1px solid rgba(255,255,255,0.2); padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 500; backdrop-filter: blur(4px); cursor: pointer; display: flex; align-items: center; gap: 6px; }

        .modal-body { padding: 15px 18px 24px; overflow-y: auto; flex-grow: 1; display: flex; flex-direction: column; gap: 12px; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .field { display: flex; flex-direction: column; gap: 4px; }
        .field label { font-size: 11px; font-weight: 700; color: var(--subtext); text-transform: uppercase; letter-spacing: 0.3px; }
        .field input, .field select { padding: 12px; border: 1px solid var(--border); border-radius: 9px; font-size: 15px; background: var(--input-bg); color: var(--text); outline: none; width: 100%; transition: 0.2s; }
        .field input:focus, .field select:focus { border-color: var(--active-accent); }

        .color-controls { display: flex; align-items: center; gap: 12px; margin-top: 4px; flex-wrap: wrap; }
        .color-circle { width: 38px; height: 38px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(128,128,128,0.3); position: relative; overflow: hidden; flex-shrink: 0; }
        .color-circle input[type="color"] { position: absolute; top: -10px; left: -10px; width: 60px; height: 60px; opacity: 0; cursor: pointer; }
        
        .btn-color-action { background: var(--input-bg); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font-size: 13px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .btn-color-action.danger { color: var(--danger); border-color: rgba(239,68,68,0.3); }

        .modal-actions { display: flex; gap: 10px; margin-top: 10px; }
        .btn-primary { flex: 2; padding: 14px; background: var(--active-accent); color: #fff; border: none; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; transition: 0.3s ease; }
        .btn-danger { flex: 1; padding: 14px; background: rgba(239,68,68,0.1); color: var(--danger); border: 1px solid rgba(239,68,68,0.3); border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; }

        .sync-indicator { position: fixed; bottom: 16px; left: 16px; background: rgba(17,24,39,0.85); color: #fff; padding: 8px 14px; border-radius: 20px; font-size: 12px; display: none; z-index: 100; font-weight: 500; backdrop-filter: blur(4px); }
        .empty { width: 100%; text-align: center; padding: 60px 20px; color: var(--subtext); font-size: 14px; display: none; }

        /* ПОЛНОЭКРАННЫЙ УМНЫЙ ZOOM */
        #imageViewer { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 999; flex-direction: column; opacity: 0; transition: opacity 0.3s ease; }
        #imageViewer.active { display: flex; opacity: 1; }
        .viewer-header { height: 60px; display: flex; justify-content: flex-end; align-items: center; padding: 0 20px; background: linear-gradient(rgba(0,0,0,0.6), transparent); z-index: 1001; }
        .viewer-close { background: rgba(255,255,255,0.2); color: #fff; border: none; padding: 8px 16px; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 600; backdrop-filter: blur(4px); }
        .viewer-img-container { flex: 1; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        #viewerImg { max-width: 100%; max-height: 100%; object-fit: contain; cursor: zoom-in; transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1); }

        #confirmDialog { display: none; position: fixed; inset: 0; background: var(--overlay); z-index: 300; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s; }
        #confirmDialog.active { display: flex; opacity: 1; }
        .confirm-box { background: var(--card); padding: 24px; border-radius: 16px; width: 300px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); transform: scale(0.95); transition: transform 0.2s cubic-bezier(0.1, 0.9, 0.2, 1); }
        #confirmDialog.active .confirm-box { transform: scale(1); }
        .confirm-box h3 { margin: 0 0 12px 0; color: var(--text); font-size: 18px; }
        .confirm-box p { color: var(--subtext); font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
        .confirm-buttons { display: flex; gap: 12px; }
    </style>
</head>
<body class="tab-IN_CLOSET">

    <!-- ЗАСТАВКА -->
    <div id="splashScreen">
        <svg class="splash-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.38 3.46L16 2a8.5 8.5 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"></path>
        </svg>
        <div class="splash-title">Мой Гардероб</div>
        <div class="splash-loader"></div>
    </div>

    <div id="imageViewer">
        <div class="viewer-header">
            <button class="viewer-close" onclick="closeFullscreen()">Закрыть</button>
        </div>
        <div class="viewer-img-container" id="viewerContainer">
            <img id="viewerImg" src="" alt="Fullscreen" onclick="toggleZoom(event)">
        </div>
    </div>

    <div id="confirmDialog">
        <div class="confirm-box">
            <h3>Удаление вещи</h3>
            <p>Вы уверены, что хотите удалить данную вещь? Это действие необратимо.</p>
            <div class="confirm-buttons">
                <button class="btn-primary" style="background:var(--input-bg); color:var(--text); flex:1;" onclick="document.getElementById('confirmDialog').classList.remove('active')">Отмена</button>
                <button class="btn-danger" style="flex:1; background:var(--danger); color:#fff; border:none;" onclick="executeDelete()">Удалить</button>
            </div>
        </div>
    </div>

    <div id="appContent">
        <div class="header">
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="Поиск по гардеробу..." oninput="applyFilters()">
                <div class="search-row-inner">
                    <select id="catFilter" class="filter-select" onchange="applyFilters()"></select>
                    <select id="sortFilter" class="filter-select" onchange="applyFilters()">
                        <option value="newest">Сначала новые</option>
                        <option value="oldest">Сначала старые</option>
                        <option value="az">По алфавиту (А–Я)</option>
                        <option value="za">По алфавиту (Я–А)</option>
                        <option value="brand">По бренду</option>
                        <option value="category">По типу</option>
                    </select>
                </div>
            </div>
            <div class="tabs">
                <div class="tab active" data-tab="IN_CLOSET" onclick="setTab('IN_CLOSET')">В шкафу <span class="badge-count" id="cnt-IN_CLOSET">0</span></div>
                <div class="tab" data-tab="WASHING" onclick="setTab('WASHING')">В стирке <span class="badge-count" id="cnt-WASHING">0</span></div>
                <div class="tab" data-tab="DRYING" onclick="setTab('DRYING')">На сушилке <span class="badge-count" id="cnt-DRYING">0</span></div>
            </div>
        </div>

        <div id="bulkBar" class="bulk-bar"><span id="bulkText">Действие:</span><button id="bulkBtn" class="bulk-btn" onclick="executeBulkAction()">Применить</button></div>
        
        <div id="grid" class="grid"></div>
        <div id="emptyState" class="empty">В данной группе пока нет вещей.</div>
        
        <button class="fab" onclick="openModal()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
        <div id="syncStatus" class="sync-indicator">Синхронизация данных...</div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО -->
    <div class="modal" id="itemModal" onclick="if(event.target===this) closeModal()">
        <div class="modal-sheet">
            <div class="modal-header">
                <h3 id="modalTitle">Свойства вещи</h3>
                <button class="close-btn-icon" onclick="closeModal()">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>

            <!-- РЕЖИМ ПРОСМОТРА -->
            <div class="view-mode" id="viewMode">
                <div class="view-photo-area">
                    <div class="view-blur-bg" id="viewBlurBg"></div>
                    <img id="viewPhotoImg" src="" onclick="openFullscreen(this.src)">
                </div>
                <div class="view-info-area">
                    <h2 class="view-title" id="viewName"></h2>
                    <div class="view-tags">
                        <div class="view-tag" id="viewCatTag"></div>
                        <div class="view-tag" id="viewColorTag"></div>
                    </div>
                    <div class="view-details">
                        <div class="detail-row"><span class="detail-label">Бренд</span><span class="detail-value" id="viewBrand"></span></div>
                        <div class="detail-row"><span class="detail-label">Статус</span><span class="detail-value" id="viewStatus"></span></div>
                        <div class="detail-row"><span class="detail-label">Заметки</span><span class="detail-value" id="viewNotes"></span></div>
                    </div>
                    <button class="btn-edit-mode" onclick="switchToEditMode()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                        Редактировать параметры
                    </button>
                </div>
            </div>

            <!-- РЕЖИМ РЕДАКТИРОВАНИЯ -->
            <div class="edit-mode" id="editMode">
                <div class="modal-top">
                    <div class="photo-preview-box" id="photoBox">
                        <div class="photo-placeholder" id="photoPlaceholder" onclick="document.getElementById('photoInput').click()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5a2.5 2.5 0 0 0-2.5 2.5v.5L3 13a1 1 0 0 0 .7 1.7h16.6a1 1 0 0 0 .7-1.7L14.5 7.5v-.5A2.5 2.5 0 0 0 12 4.5z"></path><path d="M12 7v10"></path><path d="M9 17h6"></path></svg>
                            <span>Добавить фотографию</span>
                        </div>
                        <img id="photoPreview" style="display:none;" alt="Preview" onclick="openFullscreen(this.src)">
                        <button id="btnChangePhoto" class="btn-change-photo" style="display:none;" onclick="document.getElementById('photoInput').click()">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/></svg>
                            Изменить
                        </button>
                        <input type="file" id="photoInput" accept="image/*" style="display:none;" onchange="handlePhotoSelect(event)">
                    </div>
                </div>
                <div class="modal-body">
                    <div class="field">
                        <label>Название вещи</label>
                        <input type="text" id="fName" placeholder="Введите название">
                    </div>
                    <div class="form-row">
                        <div class="field">
                            <label>Категория</label>
                            <input type="text" id="fCategory" list="cat-suggestions" placeholder="Введите или выберите">
                            <datalist id="cat-suggestions"></datalist>
                        </div>
                        <div class="field">
                            <label>Расположение</label>
                            <select id="fStatus">
                                <option value="IN_CLOSET">В шкафу</option><option value="WASHING">В стирке</option><option value="DRYING">На сушилке</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="field"><label>Бренд</label><input type="text" id="fBrand" placeholder="Укажите бренд"></div>
                        <div class="field"><label>Цвет (Описание)</label><input type="text" id="fColorText" placeholder="Например: Темно-синий"></div>
                    </div>
                    <div class="field">
                        <label>Отображение цвета</label>
                        <div class="color-controls">
                            <div class="color-circle" id="circle1" style="background-color: #ffffff;">
                                <input type="color" id="fColorHex1" value="#ffffff" oninput="updateCircle(1)" onchange="markCustomColorUsed()">
                            </div>
                            <button id="btnToggleColor2" class="btn-color-action" onclick="toggleColor2()">Добавить второй цвет</button>
                            <div class="color-circle" id="circle2" style="background-color: #ffffff; display:none;">
                                <input type="color" id="fColorHex2" value="#ffffff" oninput="updateCircle(2)" onchange="markCustomColorUsed()">
                            </div>
                            <button id="btnRemoveColor2" class="btn-color-action danger" style="display:none;" onclick="toggleColor2()">Убрать второй цвет</button>
                        </div>
                        <button id="btnClearColors" class="btn-color-action danger" style="display:none; width: 100%; margin-top: 8px;" onclick="clearCustomColors()">Сбросить ручные настройки цвета</button>
                        <input type="hidden" id="fHasCustomColors" value="false">
                    </div>
                    <div class="field"><label>Уход / Дополнительно</label><input type="text" id="fNotes" placeholder="Рекомендации по уходу"></div>
                    <div class="modal-actions">
                        <button class="btn-danger" id="btnDelete" style="display:none;" onclick="requestDelete()">Удалить</button>
                        <button class="btn-primary" id="btnSave" onclick="saveCurrentItem()">Сохранить изменения</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        var API_URL = "https://script.google.com/macros/s/AKfycbwcOpE2mAJnEmj4sjZfnB1womgZwOLueOai_y14g9OcTAM0vI9Yoo_egLHwndi4W4dZIQ/exec";
        
        var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg) tg.expand();
        if (tg && tg.colorScheme === 'dark') { document.body.classList.add('dark-theme'); }

        var myTgId = "default_user";
        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) { myTgId = tg.initDataUnsafe.user.id; }

        var CACHE_KEY = "wardrobe_v18_" + myTgId;
        var items = [];
        var currentTab = "IN_CLOSET";
        var editingId = null;
        var currentPhotoData = "";
        var isColor2Active = false;

        var NO_PHOTO_SVG = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="%239ca3af"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" /></svg>';

        var COLOR_MAP = {
            "черный": "#111827", "белый": "#ffffff", "серый": "#9ca3af", "синий": "#2563eb", "голубой": "#38bdf8", "небесный": "#0ea5e9",
            "красный": "#ef4444", "зеленый": "#10b981", "желтый": "#facc15", "коричневый": "#78350f", "розовый": "#ec4899", 
            "фиолетовый": "#7c3aed", "оранжевый": "#f97316", "бордовый": "#881337", "хаки": "#78716c", "оливковый": "#65a30d"
        };

        function showSync(text) {
            var el = document.getElementById('syncStatus');
            if (!text) { el.style.display = 'none'; return; }
            el.innerText = text; el.style.display = 'block';
        }

        function parseColorField(colorStr) {
            if (!colorStr) return { text: "", dot: "", hex1: "#ffffff", hex2: "#ffffff", hasCustom: false, isColor2Active: false };
            var parts = colorStr.split("||");
            var text = parts[0] || "";
            var h1 = parts[1];
            var h2 = parts[2];
            var bgStyle = "";
            var isTwo = (h1 && h2 && h1 !== h2);
            
            if (isTwo) bgStyle = "background: linear-gradient(90deg, " + h1 + " 50%, " + h2 + " 50%)";
            else if (h1) bgStyle = "background: " + h1;
            else {
                var clean = text.toLowerCase().trim().replace(/ё/g, "е");
                if (COLOR_MAP[clean]) bgStyle = "background: " + COLOR_MAP[clean];
            }
            var dotHtml = bgStyle ? '<div class="color-dot" style="' + bgStyle + '"></div>' : '';
            return { text: text, dot: dotHtml, hex1: h1 || "#ffffff", hex2: h2 || "#ffffff", hasCustom: !!h1, isColor2Active: isTwo, style: bgStyle };
        }

        function initGrid() {
            var select = document.getElementById('catFilter');
            var currentVal = select.value || "ALL";
            var uniqueCats = [];
            var cntIN = 0, cntWASH = 0, cntDRY = 0;

            for (var i = 0; i < items.length; i++) { 
                var it = items[i];
                if (it.category && uniqueCats.indexOf(it.category) === -1) uniqueCats.push(it.category); 
                if (it.status === "IN_CLOSET") cntIN++;
                if (it.status === "WASHING") cntWASH++;
                if (it.status === "DRYING") cntDRY++;
            }
            
            document.getElementById('cnt-IN_CLOSET').innerText = cntIN;
            document.getElementById('cnt-WASHING').innerText = cntWASH;
            document.getElementById('cnt-DRYING').innerText = cntDRY;

            uniqueCats.sort();
            var html = '<option value="ALL">Все категории</option>';
            var datalistHtml = '';
            for (var j = 0; j < uniqueCats.length; j++) { 
                html += '<option value="' + uniqueCats[j] + '">' + uniqueCats[j] + '</option>'; 
                datalistHtml += '<option value="' + uniqueCats[j] + '"></option>';
            }
            select.innerHTML = html; select.value = uniqueCats.indexOf(currentVal) !== -1 ? currentVal : "ALL";
            document.getElementById('cat-suggestions').innerHTML = datalistHtml;

            var grid = document.getElementById('grid');
            var htmlResult = '';
            
            for(var k = 0; k < items.length; k++) {
                var item = items[k];
                var colorObj = parseColorField(item.color);
                
                var safeName = (item.name || '').toLowerCase().replace(/"/g, '&quot;');
                var safeCat = (item.category || '').toLowerCase().replace(/"/g, '&quot;');
                var safeBrand = (item.brand || '').toLowerCase().replace(/"/g, '&quot;');
                var searchStr = (safeName + " " + safeBrand + " " + safeCat).replace(/"/g, '&quot;');
                
                var moveButtons = '';
                if (item.status === 'IN_CLOSET') {
                    moveButtons = '<button class="move-btn to-washing" onclick="moveItem(\'' + item.id + '\', \'WASHING\')">В стирку</button><button class="move-btn to-drying" onclick="moveItem(\'' + item.id + '\', \'DRYING\')">На сушилку</button>';
                } else if (item.status === 'WASHING') {
                    moveButtons = '<button class="move-btn to-closet" onclick="moveItem(\'' + item.id + '\', \'IN_CLOSET\')">В шкаф</button><button class="move-btn to-drying" onclick="moveItem(\'' + item.id + '\', \'DRYING\')">На сушилку</button>';
                } else {
                    moveButtons = '<button class="move-btn to-washing" onclick="moveItem(\'' + item.id + '\', \'WASHING\')">В стирку</button><button class="move-btn to-closet" onclick="moveItem(\'' + item.id + '\', \'IN_CLOSET\')">В шкаф</button>';
                }

                var imgContent = '';
                if (item.photo) {
                    var thumbSrc = item.photo.indexOf('sz=w1000') !== -1 ? item.photo.replace('sz=w1000', 'sz=w400') : item.photo;
                    imgContent = '<img src="' + thumbSrc + '" loading="lazy">';
                } else {
                    imgContent = '<div class="placeholder-img"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5a2.5 2.5 0 0 0-2.5 2.5v.5L3 13a1 1 0 0 0 .7 1.7h16.6a1 1 0 0 0 .7-1.7L14.5 7.5v-.5A2.5 2.5 0 0 0 12 4.5z"></path><path d="M12 7v10"></path><path d="M9 17h6"></path></svg></div>';
                }

                htmlResult += '<div class="card" id="card-' + item.id + '" data-status="' + item.status + '" data-category="' + safeCat + '" data-search="' + searchStr + '" data-name="' + safeName + '" data-brand="' + safeBrand + '">' +
                            '<div class="img-wrap" onclick="openModal(\'' + item.id + '\')">' + imgContent + '<span class="cat-pill">' + (item.category || 'Без категории') + '</span></div>' +
                            '<div class="card-body" onclick="openModal(\'' + item.id + '\')">' +
                                '<div class="card-title">' + (item.name || 'Без названия') + '</div>' +
                                '<div class="card-meta">' + colorObj.dot + '<span class="meta-text">' + (item.brand || '') + (item.brand && colorObj.text ? ', ' : '') + colorObj.text + '</span></div>' +
                            '</div>' +
                            '<div class="move-bar">' + moveButtons + '</div>' +
                        '</div>';
            }
            grid.innerHTML = htmlResult;
            applyFilters();
        }

        window.applyFilters = function() {
            var query = document.getElementById('searchInput').value.trim().toLowerCase();
            var cat = document.getElementById('catFilter').value.toLowerCase();
            var sortVal = document.getElementById('sortFilter').value;
            
            var cards = document.querySelectorAll('.card');
            var visibleCount = 0;
            var statusCount = 0; 
            var filteredCards = [];
            
            for(var i = 0; i < cards.length; i++) {
                var card = cards[i];
                var st = card.getAttribute('data-status');
                var c = card.getAttribute('data-category');
                var s = card.getAttribute('data-search');
                
                var match = true;
                if (st !== currentTab) match = false;
                if (cat !== "all" && c !== cat) match = false;
                if (query && s.indexOf(query) === -1) match = false;
                
                if (st === currentTab) statusCount++;
                
                if (match) { 
                    card.style.display = 'flex'; 
                    visibleCount++; 
                    filteredCards.push({ elem: card, id: Number(card.id.replace('card-', '')), name: card.getAttribute('data-name'), brand: card.getAttribute('data-brand'), cat: c });
                } else { 
                    card.style.display = 'none'; 
                }
            }
            
            filteredCards.sort(function(a, b) {
                if (sortVal === 'newest') return b.id - a.id;
                if (sortVal === 'oldest') return a.id - b.id;
                if (sortVal === 'az') return a.name.localeCompare(b.name);
                if (sortVal === 'za') return b.name.localeCompare(a.name);
                if (sortVal === 'brand') return a.brand.localeCompare(b.brand);
                if (sortVal === 'category') return a.cat.localeCompare(b.cat);
                return 0;
            });
            
            for(var j = 0; j < filteredCards.length; j++) { filteredCards[j].elem.style.order = j; }
            
            document.getElementById('emptyState').style.display = (visibleCount === 0) ? 'block' : 'none';
            
            var bulkBar = document.getElementById('bulkBar');
            if (currentTab === "WASHING" && statusCount > 0) {
                bulkBar.classList.add('visible'); document.getElementById('bulkText').innerText = "В стирке: " + statusCount; document.getElementById('bulkBtn').innerText = "Переместить всё на сушилку";
            } else if (currentTab === "DRYING" && statusCount > 0) {
                bulkBar.classList.add('visible'); document.getElementById('bulkText').innerText = "На сушилке: " + statusCount; document.getElementById('bulkBtn').innerText = "Вернуть всё в шкаф";
            } else { bulkBar.classList.remove('visible'); }
        };

        window.setTab = function(tab) {
            if (tg) tg.HapticFeedback.impactOccurred('light');
            currentTab = tab;
            document.body.className = document.body.className.replace(/tab-\w+/g, '');
            document.body.classList.add('tab-' + tab);
            var tabs = document.querySelectorAll('.tab');
            for(var i=0; i<tabs.length; i++) {
                if (tabs[i].getAttribute('data-tab') === tab) tabs[i].classList.add('active'); else tabs[i].classList.remove('active');
            }
            applyFilters();
        };

        function hideSplash() {
            var splash = document.getElementById('splashScreen');
            if (splash) { splash.style.opacity = '0'; setTimeout(function(){ splash.style.visibility = 'hidden'; }, 500); }
        }

        function fetchFromCloud() {
            fetch(API_URL + "?user_id=" + myTgId).then(function(res) { return res.json(); }).then(function(data) {
                if (Array.isArray(data)) { items = data; localStorage.setItem(CACHE_KEY, JSON.stringify(items)); initGrid(); }
                hideSplash();
            }).catch(function(e) { hideSplash(); });
        }

        window.moveItem = function(id, newStatus) {
            if (tg) tg.HapticFeedback.impactOccurred('light');
            for(var i=0; i<items.length; i++) { if(String(items[i].id) === String(id)) { items[i].status = newStatus; break; } }
            localStorage.setItem(CACHE_KEY, JSON.stringify(items)); initGrid(); 
            fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "statusBatch", ids: [id], status: newStatus, user_id: myTgId }) });
        };

        window.executeBulkAction = function() {
            if (tg) tg.HapticFeedback.impactOccurred('light');
            var targetStatus = currentTab === "WASHING" ? "DRYING" : "IN_CLOSET";
            var affectedIds = [];
            for(var i=0; i<items.length; i++) { if(items[i].status === currentTab) { items[i].status = targetStatus; affectedIds.push(items[i].id); } }
            if (affectedIds.length === 0) return;
            localStorage.setItem(CACHE_KEY, JSON.stringify(items)); initGrid();
            fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "statusBatch", ids: affectedIds, status: targetStatus, user_id: myTgId }) });
        };

        window.updateCircle = function(num) {
            var hex = document.getElementById('fColorHex' + num).value;
            document.getElementById('circle' + num).style.backgroundColor = hex;
        };

        function checkResetBtnVisibility() {
            var isCustom = document.getElementById('fHasCustomColors').value === "true";
            document.getElementById('btnClearColors').style.display = isCustom ? 'inline-block' : 'none';
        }

        window.markCustomColorUsed = function() { 
            document.getElementById('fHasCustomColors').value = "true"; checkResetBtnVisibility();
        };

        window.toggleColor2 = function() {
            isColor2Active = !isColor2Active;
            document.getElementById('circle2').style.display = isColor2Active ? 'block' : 'none';
            document.getElementById('btnRemoveColor2').style.display = isColor2Active ? 'inline-block' : 'none';
            document.getElementById('btnToggleColor2').style.display = isColor2Active ? 'none' : 'inline-block';
            if (isColor2Active) markCustomColorUsed();
        };

        window.clearCustomColors = function() {
            document.getElementById('fHasCustomColors').value = "false";
            document.getElementById('fColorHex1').value = "#ffffff"; updateCircle(1);
            document.getElementById('fColorHex2').value = "#ffffff"; updateCircle(2);
            isColor2Active = false;
            document.getElementById('circle2').style.display = 'none';
            document.getElementById('btnRemoveColor2').style.display = 'none';
            document.getElementById('btnToggleColor2').style.display = 'inline-block';
            checkResetBtnVisibility();
        };

        // --- УМНЫЙ ZOOM (Координаты) ---
        window.openFullscreen = function(src) {
            var img = document.getElementById('viewerImg');
            img.src = src; img.dataset.zoomed = "0"; img.style.transform = "scale(1)"; img.style.cursor = "zoom-in";
            document.getElementById('imageViewer').classList.add('active');
        };
        window.closeFullscreen = function() { document.getElementById('imageViewer').classList.remove('active'); };

        window.toggleZoom = function(e) {
            var img = e.target;
            if (!img.dataset.zoomed || img.dataset.zoomed === "0") {
                var rect = img.getBoundingClientRect();
                var x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
                var y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
                img.style.transformOrigin = (x / rect.width * 100) + "% " + (y / rect.height * 100) + "%";
                img.dataset.zoomed = "1"; img.style.transform = "scale(3)"; img.style.cursor = "zoom-out";
            } else {
                img.dataset.zoomed = "0"; img.style.transform = "scale(1)"; img.style.cursor = "zoom-in";
            }
        };

        window.requestDelete = function() {
            if (tg) tg.HapticFeedback.impactOccurred('light');
            document.getElementById('confirmDialog').classList.add('active');
        };

        window.executeDelete = function() {
            document.getElementById('confirmDialog').classList.remove('active');
            if (!editingId) return;
            var newItems = [];
            for(var i=0; i<items.length; i++) { if(String(items[i].id) !== String(editingId)) newItems.push(items[i]); }
            items = newItems;
            localStorage.setItem(CACHE_KEY, JSON.stringify(items)); initGrid(); closeModal();
            fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "delete", id: editingId, user_id: myTgId }) });
        };

        window.switchToEditMode = function() {
            document.getElementById('viewMode').style.display = 'none';
            document.getElementById('editMode').style.display = 'flex';
        };

        // --- МОДАЛЬНОЕ ОКНО ---
        window.openModal = function(id) {
            if (tg) tg.HapticFeedback.impactOccurred('light');
            editingId = id || null;
            
            var prev = document.getElementById('photoPreview');
            var placeholder = document.getElementById('photoPlaceholder');
            var changeBtn = document.getElementById('btnChangePhoto');

            if (id) {
                var item = null;
                for(var i=0; i<items.length; i++) { if(String(items[i].id) === String(id)) { item = items[i]; break; } }
                var cObj = parseColorField(item.color);
                
                // Заполнение режима ПРОСМОТРА
                document.getElementById('modalTitle').innerText = "Информация о вещи";
                document.getElementById('viewName').innerText = item.name || "Без названия";
                
                var viewImg = document.getElementById('viewPhotoImg');
                var viewBlur = document.getElementById('viewBlurBg');
                if (item.photo) {
                    viewImg.src = item.photo; viewImg.style.display = 'block';
                    viewBlur.style.backgroundImage = 'url(' + item.photo + ')';
                } else {
                    viewImg.style.display = 'none'; viewBlur.style.backgroundImage = 'none';
                }

                document.getElementById('viewCatTag').innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>' + (item.category || "Нет категории");
                document.getElementById('viewColorTag').innerHTML = cObj.dot + (cObj.text || "Цвет не указан");
                
                document.getElementById('viewBrand').innerText = item.brand || "Не указан";
                var statusText = item.status === "IN_CLOSET" ? "В шкафу" : (item.status === "WASHING" ? "В стирке" : "На сушилке");
                document.getElementById('viewStatus').innerText = statusText;
                document.getElementById('viewNotes').innerText = item.notes || "—";

                // Заполнение режима РЕДАКТИРОВАНИЯ
                document.getElementById('fName').value = item.name || "";
                document.getElementById('fCategory').value = item.category || "";
                document.getElementById('fStatus').value = item.status || "IN_CLOSET";
                document.getElementById('fBrand').value = item.brand || "";
                document.getElementById('fNotes').value = item.notes || "";
                
                document.getElementById('fColorText').value = cObj.text;
                document.getElementById('fColorHex1').value = cObj.hex1; updateCircle(1);
                document.getElementById('fColorHex2').value = cObj.hex2; updateCircle(2);
                document.getElementById('fHasCustomColors').value = cObj.hasCustom ? "true" : "false";
                
                isColor2Active = cObj.isColor2Active;
                document.getElementById('circle2').style.display = isColor2Active ? 'block' : 'none';
                document.getElementById('btnRemoveColor2').style.display = isColor2Active ? 'inline-block' : 'none';
                document.getElementById('btnToggleColor2').style.display = isColor2Active ? 'none' : 'inline-block';
                checkResetBtnVisibility();

                currentPhotoData = item.photo || ""; 
                if (currentPhotoData) { 
                    prev.src = currentPhotoData; prev.style.display = "block"; 
                    placeholder.style.display = "none"; changeBtn.style.display = "flex";
                } else {
                    prev.style.display = "none"; placeholder.style.display = "flex"; changeBtn.style.display = "none";
                }
                document.getElementById('btnDelete').style.display = "block";

                // Показываем просмотр
                document.getElementById('viewMode').style.display = 'flex';
                document.getElementById('editMode').style.display = 'none
