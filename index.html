<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Управление гардеробом</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root { --bg: #f2f4f7; --card: #ffffff; --text: #111827; --subtext: #6b7280; --accent: #2563eb; --border: #e5e7eb; --danger: #ef4444; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 90px; }

        .header { background: var(--card); padding: 12px 14px 8px; position: sticky; top: 0; z-index: 50; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
        .search-row { display: flex; gap: 8px; margin-bottom: 10px; }
        .search-input, .filter-select { flex: 1; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; background: #f9fafb; outline: none; }
        
        .tabs { display: flex; gap: 6px; }
        .tab { flex: 1; text-align: center; padding: 9px 4px; font-weight: 600; font-size: 13px; color: var(--subtext); border-radius: 8px; cursor: pointer; background: #f3f4f6; }
        .tab.active { background: var(--accent); color: #fff; }
        .badge-count { display: inline-block; padding: 1px 6px; border-radius: 10px; font-size: 11px; margin-left: 4px; background: rgba(0,0,0,0.12); }

        .bulk-bar { display: none; justify-content: space-between; align-items: center; padding: 10px 14px; background: #eff6ff; border-bottom: 1px solid #bfdbfe; font-size: 13px; font-weight: 600; color: #1e40af; }
        .bulk-bar.visible { display: flex; }
        .bulk-btn { background: var(--accent); color: #fff; border: none; padding: 7px 12px; border-radius: 8px; font-weight: 600; font-size: 12px; cursor: pointer; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
        .card { background: var(--card); border-radius: 14px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.05); display: flex; flex-direction: column; border: 1px solid var(--border); }
        .img-wrap { position: relative; width: 100%; height: 185px; background: #e5e7eb; cursor: pointer; }
        .img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .cat-pill { position: absolute; top: 8px; left: 8px; background: rgba(17,24,39,0.72); backdrop-filter: blur(4px); color: #fff; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 500; }
        .card-body { padding: 10px; flex-grow: 1; display: flex; flex-direction: column; gap: 4px; cursor: pointer; }
        .card-title { font-weight: 700; font-size: 14px; line-height: 1.25; color: var(--text); }
        .card-meta { font-size: 12px; color: var(--subtext); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .color-dot { width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.2); display: inline-block; }
        
        .move-bar { display: flex; border-top: 1px solid var(--border); background: #f9fafb; }
        .move-btn { flex: 1; padding: 10px 4px; font-size: 11px; font-weight: 700; border: none; background: transparent; cursor: pointer; color: var(--accent); border-right: 1px solid var(--border); }
        .move-btn:last-child { border-right: none; }

        .fab { position: fixed; bottom: 20px; right: 20px; width: 58px; height: 58px; border-radius: 29px; background: var(--accent); color: #fff; font-size: 32px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(37,99,235,0.4); border: none; z-index: 90; cursor: pointer; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 200; align-items: flex-end; justify-content: center; }
        .modal.active { display: flex; }
        .modal-sheet { background: var(--card); width: 100%; max-width: 500px; max-height: 92vh; border-radius: 20px 20px 0 0; padding: 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { margin: 0; font-size: 18px; }
        .close-x { background: none; border: none; font-size: 22px; color: var(--subtext); cursor: pointer; }
        
        .photo-preview-box { width: 100%; height: 220px; border-radius: 12px; background: #f3f4f6; border: 2px dashed var(--border); display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; cursor: pointer; }
        .photo-preview-box img { width: 100%; height: 100%; object-fit: contain; background: #111; }
        .photo-placeholder { color: var(--subtext); font-size: 14px; font-weight: 500; text-align: center; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .field { display: flex; flex-direction: column; gap: 4px; }
        .field label { font-size: 11px; font-weight: 700; color: var(--subtext); text-transform: uppercase; }
        .field input, .field select { padding: 11px; border: 1px solid var(--border); border-radius: 9px; font-size: 15px; background: #f9fafb; outline: none; width: 100%; }

        .modal-actions { display: flex; gap: 10px; margin-top: 6px; }
        .btn-primary { flex: 2; padding: 13px; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; }
        .btn-danger { flex: 1; padding: 13px; background: #fee2e2; color: var(--danger); border: none; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; }

        .sync-indicator { position: fixed; bottom: 16px; left: 16px; background: rgba(17,24,39,0.8); color: #fff; padding: 6px 12px; border-radius: 20px; font-size: 12px; display: none; z-index: 100; }
        .empty { grid-column: 1 / -1; text-align: center; padding: 50px 20px; color: var(--subtext); }

        #telegramOnlyScreen { display: none; position: fixed; inset: 0; background: #fff; z-index: 999; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
        #telegramOnlyScreen h2 { margin-bottom: 5px; color: var(--text); }
        #telegramOnlyScreen p { color: var(--subtext); line-height: 1.5; }
    </style>
</head>
<body>

    <div id="telegramOnlyScreen">
        <h2>Доступ ограничен</h2>
        <p>Пожалуйста, откройте это приложение через Telegram.<br>Авторизация происходит автоматически.</p>
    </div>

    <div id="appContent" style="display:none;">
        <div class="header">
            <div class="search-row">
                <input type="text" id="searchInput" class="search-input" placeholder="Поиск..." oninput="tryRender()">
                <select id="catFilter" class="filter-select" onchange="tryRender()"></select>
            </div>
            <div class="tabs">
                <div class="tab active" data-tab="IN_CLOSET" onclick="setTab('IN_CLOSET')">Шкаф <span class="badge-count" id="cnt-IN_CLOSET">0</span></div>
                <div class="tab" data-tab="WASHING" onclick="setTab('WASHING')">Стирка <span class="badge-count" id="cnt-WASHING">0</span></div>
                <div class="tab" data-tab="DRYING" onclick="setTab('DRYING')">Сушилка <span class="badge-count" id="cnt-DRYING">0</span></div>
            </div>
        </div>

        <div id="bulkBar" class="bulk-bar"><span id="bulkText">Действие</span><button id="bulkBtn" class="bulk-btn" onclick="executeBulkAction()">Выполнить</button></div>
        <div id="grid" class="grid"></div>
        <button class="fab" onclick="openModal()">+</button>
        <div id="syncStatus" class="sync-indicator">Синхронизация...</div>
    </div>

    <!-- Модальное окно -->
    <div class="modal" id="itemModal" onclick="if(event.target===this) closeModal()">
        <div class="modal-sheet">
            <div class="modal-header"><h3 id="modalTitle">Свойства вещи</h3><button class="close-x" onclick="closeModal()">✕</button></div>

            <label class="photo-preview-box" id="photoBox">
                <span class="photo-placeholder" id="photoPlaceholder">📷 Нажми, чтобы сделать фото</span>
                <img id="photoPreview" style="display:none;" alt="Preview">
                <input type="file" id="photoInput" accept="image/*" style="display:none;" onchange="handlePhotoSelect(event)">
            </label>

            <div class="field">
                <label>Название вещи</label>
                <input type="text" id="fName" placeholder="Например: Свитшот с принтом">
            </div>

            <div class="form-row">
                <div class="field">
                    <label>Категория (Выбери или введи)</label>
                    <input type="text" id="fCategory" list="cat-suggestions" placeholder="Впиши или выбери...">
                    <datalist id="cat-suggestions">
                        <option value="Верх / Худи"></option><option value="Футболки"></option><option value="Штаны / Джинсы"></option><option value="Обувь"></option><option value="Белье / Носки"></option>
                    </datalist>
                </div>
                <div class="field">
                    <label>Статус</label>
                    <select id="fStatus">
                        <option value="IN_CLOSET">В шкафу</option><option value="WASHING">В стирке</option><option value="DRYING">На сушилке</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="field"><label>Бренд</label><input type="text" id="fBrand" placeholder="Например: Nike"></div>
                <div class="field"><label>Цвет</label><input type="text" id="fColor" placeholder="Например: Черный"></div>
            </div>

            <div class="field"><label>Заметки / Уход</label><input type="text" id="fNotes" placeholder="Например: 40°C"></div>

            <div class="modal-actions">
                <button class="btn-danger" id="btnDelete" style="display:none;" onclick="deleteCurrentItem()">Удалить</button>
                <button class="btn-primary" id="btnSave" onclick="saveCurrentItem()">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. ТВОЯ ССЫЛКА НА БЭКЕНД GOOGLE ---
        var API_URL = "https://script.google.com/macros/s/AKfycbwcOpE2mAJnEmj4sjZfnB1womgZwOLueOai_y14g9OcTAM0vI9Yoo_egLHwndi4W4dZIQ/exec";
        
        var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg) tg.expand();

        // 2. БЕЗОПАСНО ДОСТАЕМ ID ТЕЛЕГРАМА
        var myTgId = null;
        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
            myTgId = tg.initDataUnsafe.user.id;
        }

        var items = [];
        var currentTab = "IN_CLOSET";
        var editingId = null;
        var currentPhotoData = "";
        
        // Меняем ключ кэша на v6, чтобы гарантированно стереть ошибки прошлых запусков
        var CACHE_KEY = "wardrobe_v6_" + myTgId;
        var COLOR_MAP = { "черный": "#111827", "белый": "#ffffff", "серый": "#9ca3af", "синий": "#2563eb", "красный": "#ef4444", "зеленый": "#10b981", "желтый": "#facc15", "коричневый": "#78350f", "розовый": "#ec4899" };

        function showError(msg) {
            var grid = document.getElementById('grid');
            if (grid) grid.innerHTML = '<div class="empty" style="color:red; font-weight:bold;">Ошибка: ' + msg + '</div>';
            else alert(msg);
        }

        function showSync(text) {
            var el = document.getElementById('syncStatus');
            if (!text) { el.style.display = 'none'; return; }
            el.innerText = text; el.style.display = 'block';
        }

        function fetchFromCloud() {
            if (typeof fetch === 'undefined') { showError("Браузер устарел. Обновите WebView."); return; }
            
            showSync("Синхронизация...");
            fetch(API_URL + "?user_id=" + myTgId)
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (Array.isArray(data)) {
                    items = data;
                    localStorage.setItem(CACHE_KEY, JSON.stringify(items));
                    tryRender();
                }
                showSync("");
            })
            .catch(function(e) {
                showSync("");
                console.log("Оффлайн", e);
            });
        }

        function updateDynamicFilters() {
            var select = document.getElementById('catFilter');
            var currentVal = select.value || "ALL";
            
            var uniqueCats = [];
            for (var i = 0; i < items.length; i++) {
                var cat = items[i].category;
                if (cat && uniqueCats.indexOf(cat) === -1) uniqueCats.push(cat);
            }
            
            var html = '<option value="ALL">Все категории</option>';
            for (var j = 0; j < uniqueCats.length; j++) {
                html += '<option value="' + uniqueCats[j] + '">' + uniqueCats[j] + '</option>';
            }
            
            select.innerHTML = html;
            if (uniqueCats.indexOf(currentVal) !== -1) select.value = currentVal;
            else select.value = "ALL";
        }

        function render() {
            updateDynamicFilters();
            
            var states = ["IN_CLOSET", "WASHING", "DRYING"];
            for (var s = 0; s < states.length; s++) {
                var st = states[s];
                var count = 0;
                for(var i = 0; i < items.length; i++) { if(items[i].status === st) count++; }
                document.getElementById('cnt-' + st).innerText = count;
            }

            var bulkBar = document.getElementById('bulkBar');
            var currentCount = 0;
            for(var i = 0; i < items.length; i++) { if(items[i].status === currentTab) currentCount++; }
            
            if (currentTab === "WASHING" && currentCount > 0) {
                bulkBar.classList.add('visible'); document.getElementById('bulkText').innerText = "В стирке: " + currentCount; document.getElementById('bulkBtn').innerText = "Всё на сушилку →";
            } else if (currentTab === "DRYING" && currentCount > 0) {
                bulkBar.classList.add('visible'); document.getElementById('bulkText').innerText = "Высохло: " + currentCount; document.getElementById('bulkBtn').innerText = "Всё в шкаф ✓";
            } else { bulkBar.classList.remove('visible'); }

            var grid = document.getElementById('grid');
            var query = document.getElementById('searchInput').value.trim().toLowerCase();
            var cat = document.getElementById('catFilter').value;

            var filtered = [];
            for(var i = 0; i < items.length; i++) {
                var it = items[i];
                if (it.status !== currentTab) continue;
                if (cat !== "ALL" && it.category !== cat) continue;
                if (query) {
                    var n = (it.name || "").toLowerCase();
                    var b = (it.brand || "").toLowerCase();
                    var c = (it.category || "").toLowerCase();
                    if (n.indexOf(query) === -1 && b.indexOf(query) === -1 && c.indexOf(query) === -1) continue;
                }
                filtered.push(it);
            }

            if (filtered.length === 0) { grid.innerHTML = '<div class="empty">Список пуст.</div>'; return; }

            var htmlResult = '';
            for(var k = 0; k < filtered.length; k++) {
                var item = filtered[k];
                var colorKey = (item.color || "").toLowerCase();
                var hex = COLOR_MAP[colorKey] || null;
